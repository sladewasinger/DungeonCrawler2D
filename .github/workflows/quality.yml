name: Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run --reporter=default --reporter=json --outputFile=.verify-reports/vitest.json
      - run: npm run verify:content
      - run: npm run build
      - run: npm run verify:e2e
      - run: npm run verify:spec -- all-completed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-verification-artifacts
          path: |
            artifacts/qa/
            .verify-reports/
          if-no-files-found: ignore
