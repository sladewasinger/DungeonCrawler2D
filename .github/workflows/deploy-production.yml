name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::510682130762:role/dungeoncrawler2d-prod-github-actions-deploy
  ARTIFACT_BUCKET: dungeoncrawler2d-artifacts-510682130762
  FRONTEND_BUCKET: dungeoncrawl2d.austinwasinger.com
  CLOUDFRONT_DISTRIBUTION_ID: E253TI6NRUSHMS
  SITE_URL: https://dungeoncrawl2d.austinwasinger.com
  FLY_GAME_WS_URL: wss://ws.dungeoncrawl2d.austinwasinger.com/ws

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      use_fly: ${{ steps.target.outputs.use_fly }}
      ws_url: ${{ steps.target.outputs.ws_url }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve deploy target
        id: target
        shell: bash
        env:
          HAS_FLY_TOKEN: ${{ secrets.FLY_API_TOKEN != '' }}
          OVERRIDE_WS_URL: ${{ vars.VITE_GAME_WS_URL }}
        run: |
          set -euo pipefail
          if [ "$HAS_FLY_TOKEN" = "true" ]; then
            echo "use_fly=true" >> "$GITHUB_OUTPUT"
            ws_url="${OVERRIDE_WS_URL:-$FLY_GAME_WS_URL}"
          else
            echo "use_fly=false" >> "$GITHUB_OUTPUT"
            ws_url="$OVERRIDE_WS_URL"
          fi
          echo "ws_url=$ws_url" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run verify:content
      - run: npm run verify:docs
      - name: Build packages
        env:
          VITE_GAME_WS_URL: ${{ steps.target.outputs.ws_url }}
        run: npm run build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-artifacts
          path: |
            packages/client/dist/
            packages/game-server/dist/

  deploy-fly:
    needs: build-and-verify
    if: needs.build-and-verify.outputs.use_fly == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master

      - name: Deploy game server to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

  deploy-frontend-aws:
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-artifacts

      - uses: aws-actions/configure-aws-credentials@61cd5800c18cd650d23785df9484e8ff76655acf # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish server bundle (EC2 fallback)
        if: needs.build-and-verify.outputs.use_fly != 'true'
        run: aws s3 cp packages/game-server/dist/main.cjs "s3://$ARTIFACT_BUCKET/server/main.cjs"

      - name: Publish client
        run: |
          aws s3 sync packages/client/dist "s3://$FRONTEND_BUCKET" --delete \
            --cache-control "no-cache"
          aws s3 cp packages/client/dist/assets "s3://$FRONTEND_BUCKET/assets" \
            --recursive --exclude "*" \
            --include "*-????????.js" --include "*-????????.css" --include "*.webp" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync packages/client/dist "s3://$FRONTEND_BUCKET" \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache" --content-type "text/html"
          if [ -f packages/client/dist/sw.js ]; then
            aws s3 cp packages/client/dist/sw.js "s3://$FRONTEND_BUCKET/sw.js" \
              --cache-control "no-cache"
          fi
          if [ -f packages/client/dist/manifest.webmanifest ]; then
            aws s3 cp packages/client/dist/manifest.webmanifest "s3://$FRONTEND_BUCKET/manifest.webmanifest" \
              --cache-control "no-cache" --content-type "application/manifest+json"
          fi

      - name: Restart game server on published bundle (EC2 fallback)
        if: needs.build-and-verify.outputs.use_fly != 'true'
        shell: bash
        run: |
          set -euo pipefail
          instance_id=$(aws ec2 describe-instances \
            --filters Name=tag:project,Values=dungeoncrawler2d Name=tag:environment,Values=prod Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId | [0]' --output text)
          test "$instance_id" != "None"
          command_id=$(aws ssm send-command \
            --instance-ids "$instance_id" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["sudo systemctl restart dungeoncrawler2d","sudo systemctl is-active dungeoncrawler2d"]' \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance_id"

      - name: Activate client at the edge
        shell: bash
        run: |
          set -euo pipefail
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --id "$invalidation_id"

  smoke:
    needs: [build-and-verify, deploy-fly, deploy-frontend-aws]
    if: always() && needs.build-and-verify.result == 'success' && (needs.deploy-fly.result == 'success' || needs.deploy-fly.result == 'skipped') && needs.deploy-frontend-aws.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Smoke-test deployed site
        env:
          GAME_WS_URL: ${{ needs.build-and-verify.outputs.ws_url }}
        run: node tools/smoke-production.mjs "$SITE_URL"
