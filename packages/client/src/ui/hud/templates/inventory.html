<template id="hud-inventory-template">
  <div class="hud-inventory" data-hud-inventory hidden role="dialog" aria-modal="true" aria-label="Inventory">
    <section class="hud-inventory__panel" data-inventory-workspace>
      <div class="hud-inventory__header">
        <strong>Inventory</strong>
        <span class="hud-inventory__summary" data-hud-inventory-summary></span>
        <button class="hud-button hud-button--close" data-hud-inventory-close type="button" aria-label="Close inventory">×</button>
      </div>
      <div class="hud-inventory__body">
        <div class="hud-inventory__list" data-hud-inventory-list></div>
      </div>
    </section>
  </div>
</template>
