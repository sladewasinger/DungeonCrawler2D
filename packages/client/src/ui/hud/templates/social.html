<template id="hud-party-template">
  <div class="hud-panel hud-party" data-hud-party>
    <div class="hud-party__header"><span class="hud-title">Party</span><span data-hud-party-count></span></div>
    <div class="hud-party__members" data-hud-party-members></div>
    <div class="hud-party__invites" data-hud-party-invites></div>
  </div>
</template>

<template id="hud-party-member-template">
  <div class="hud-party__member" data-hud-party-member>
    <span data-hud-party-member-name></span><span data-hud-party-member-status></span>
  </div>
</template>

<template id="hud-party-invite-template">
  <div class="hud-party-invite" data-hud-party-invite>
    <span class="hud-party-invite__message" data-hud-party-invite-message></span>
    <div class="hud-party-invite__actions"><button class="hud-button" data-hud-party-accept type="button">Accept</button><button class="hud-button" data-hud-party-decline type="button">Decline</button></div>
  </div>
</template>

<template id="hud-party-tracker-template">
  <div class="hud-panel hud-party" data-hud-party>
    <div class="hud-party__header"><div class="hud-title" data-hud-party-title>Party</div><button class="hud-button" type="button" data-hud-party-invites-button>Invites</button></div>
    <div class="hud-party__invites" data-hud-party-invites hidden></div>
    <div class="hud-party__members" data-hud-party-members></div>
  </div>
</template>

<template id="hud-party-member-row-template">
  <div class="hud-party__member" data-hud-party-member></div>
</template>

<template id="hud-party-action-row-template">
  <div class="hud-party-invite__row" data-hud-party-action-row><span data-hud-party-action-label></span><div class="hud-party-invite__actions" data-hud-party-action-buttons></div></div>
</template>

<template id="hud-party-empty-template">
  <span class="hud-muted" data-hud-party-empty>No active invitations</span>
</template>
