<template id="hud-session-overlay-template">
  <div class="hud-session" data-hud-session aria-modal="true" role="dialog">
    <section class="hud-session__card" data-hud-session-card>
      <div class="hud-session__primary" data-hud-session-primary></div>
      <div class="hud-session__confirmation" data-hud-session-confirmation></div>
    </section>
  </div>
</template>

<template id="hud-session-gear-template">
  <button class="hud-session__gear" type="button" aria-label="Game menu" aria-expanded="false">⚙</button>
</template>

<template id="hud-session-heading-template">
  <h2 class="hud-session__heading" data-hud-session-heading></h2>
</template>

<template id="hud-session-subheading-template">
  <h3 class="hud-session__subheading" data-hud-session-subheading></h3>
</template>

<template id="hud-session-confirmation-copy-template">
  <p class="hud-session__detail" data-hud-session-detail></p>
</template>

<template id="hud-session-advanced-template">
  <div class="hud-session__advanced" data-hud-session-advanced></div>
</template>
