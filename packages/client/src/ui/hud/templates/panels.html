<template id="hud-hotbar-template">
  <div class="hud-hotbar" data-hud-hotbar></div>
</template>

<template id="hud-hotbar-slot-template">
  <button class="hud-hotbar__slot" type="button" data-hud-hotbar-slot></button>
</template>

<template id="hud-buffs-template">
  <div class="hud-panel hud-buffs" data-hud-buffs>
    <div class="hud-title">Effects</div>
    <div class="hud-buffs__list" data-hud-buffs-list></div>
  </div>
</template>

<template id="hud-buff-template">
  <span class="hud-buff" data-hud-buff></span>
</template>

<template id="hud-chat-template">
  <section class="hud-chat" aria-label="Chat">
    <div class="hud-chat__lines" data-hud-chat-lines></div>
    <input class="hud-chat__input" data-hud-chat-input maxlength="500" placeholder="press Enter to chat" aria-label="Chat message">
    <nav class="hud-chat__tabs" data-hud-chat-tabs aria-label="Chat channels"></nav>
  </section>
</template>

<template id="hud-chat-tab-template">
  <button class="hud-chat__tab" type="button" data-hud-chat-tab></button>
</template>

<template id="hud-chat-line-template">
  <div class="hud-chat__line" data-hud-chat-line><strong data-hud-chat-author></strong><span data-hud-chat-text></span></div>
</template>

<template id="hud-contacts-template">
  <div class="hud-panel hud-contacts" data-hud-contacts>
    <div class="hud-panel__header" data-hud-contacts-header></div>
    <div class="hud-contacts__list" data-hud-contacts-list></div>
  </div>
</template>

<template id="hud-contact-row-template">
  <div class="hud-contacts__row" data-hud-contact-row>
    <span data-hud-contact-name></span>
    <span class="hud-muted" data-hud-contact-presence></span>
    <button class="hud-button" type="button" data-hud-contact-message>DM</button>
  </div>
</template>

<template id="hud-craft-template">
  <div class="hud-panel hud-craft" data-hud-craft>
    <div class="hud-panel__header" data-hud-craft-header></div>
    <div class="hud-craft__list" data-hud-craft-list></div>
  </div>
</template>

<template id="hud-craft-row-template">
  <div class="hud-craft__row" data-hud-craft-row>
    <div class="hud-craft__copy"><strong data-hud-craft-name></strong><span data-hud-craft-description></span></div>
    <button class="hud-button" type="button" data-hud-craft-action>Craft</button>
  </div>
</template>

<template id="hud-stash-template">
  <div class="hud-panel hud-stash" data-hud-stash>
    <div class="hud-panel__header" data-hud-stash-header></div>
    <div class="hud-stash__columns" data-hud-stash-columns></div>
  </div>
</template>

<template id="hud-stash-columns-template">
  <div class="hud-stash__columns" data-hud-stash-columns></div>
</template>

<template id="hud-stash-column-template">
  <div class="hud-stash__column" data-hud-stash-column>
    <div class="hud-title" data-hud-stash-column-title></div>
    <div class="hud-stash__rows" data-hud-stash-rows></div>
  </div>
</template>

<template id="hud-settings-template">
  <div class="hud-settings" data-hud-settings></div>
</template>

<template id="hud-empty-template">
  <div class="hud-muted" data-hud-empty></div>
</template>
