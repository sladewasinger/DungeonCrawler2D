<template id="hud-touch-template">
  <div class="hud-touch" data-hud-touch aria-hidden="true">
    <div class="hud-touch__stick" data-hud-touch-stick><div class="hud-touch__knob" data-hud-touch-knob></div></div>
    <button class="hud-touch__button hud-touch__button--attack" data-hud-touch-button="attack" type="button">ATTACK</button>
    <button class="hud-touch__button hud-touch__button--block" data-hud-touch-button="block" type="button">BLOCK</button>
    <button class="hud-touch__button hud-touch__button--jump" data-hud-touch-button="jump" type="button">JUMP</button>
    <button class="hud-touch__button hud-touch__button--interact" data-hud-touch-button="interact" type="button">USE</button>
    <button class="hud-touch__button hud-touch__button--throw" data-hud-touch-button="throw" type="button">THROW</button>
    <button class="hud-touch__bag" data-hud-touch-bag type="button">BAG</button>
  </div>
</template>
