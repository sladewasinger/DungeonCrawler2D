<template id="hud-root-template">
  <div class="dc2d-hud"></div>
</template>

<template id="hud-chat-template">
  <section class="hud-chat" aria-label="Chat">
    <div class="hud-chat__lines" data-hud-chat-lines></div>
    <input class="hud-chat__input" data-hud-chat-input maxlength="500" placeholder="press Enter to chat" aria-label="Chat message">
    <nav class="hud-chat__tabs" data-hud-chat-tabs aria-label="Chat channels"></nav>
  </section>
</template>
