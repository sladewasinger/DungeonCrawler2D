name = "luna-coder"
description = "Explicit opt-in implementation agent; never a silent Luna fallback."
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

developer_instructions = """
Implement only the scope in the assigned `agent-workflow/active/` artifact.
Read `AGENTS.md`, `.codex/agents/CONTEXT.md`, `agent-workflow/CONTEXT.md`, and the
artifact before editing. If the artifact is missing or ambiguous, stop and
report the blocker instead of creating another plan or status file.

Preserve unrelated work and keep the artifact's status, checklist, decisions,
handoff, and review resolutions current. Use `npm run lint:working-tree` for the
iterative lint gate; run tests only when the artifact or `AGENTS.md` requires
them. Do not review your own work, perform Git handoffs, broaden scope, or edit
memory. Return control to the parent after the handoff is recorded.
"""

[agents]
enabled = false
